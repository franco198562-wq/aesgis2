<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Staff Login — The Aegis Institute</title>

  <link
    rel="stylesheet"
    href="/portal.css"
  >

</head>

<body class="portal-body">

  <div class="login-page">

    <div class="login-card">

      <div class="login-logo">
        A
      </div>

      <div class="login-brand">
        THE AEGIS INSTITUTE
      </div>

      <div class="login-kicker">
        STAFF PORTAL
      </div>

      <h1>
        Sign in.
      </h1>

      <p class="login-description">
        Use your administrator password or staff access code to continue.
      </p>


      <!-- MAIN ADMIN -->

      <div class="login-section">

        <div class="login-section-title">
          Administrator
        </div>

        <form id="adminLoginForm">

          <label for="adminPassword">
            Administrator Password
          </label>

          <input
            id="adminPassword"
            type="password"
            placeholder="Enter administrator password"
            autocomplete="current-password"
            required
          >

          <button
            type="submit"
            class="primary-button full-width"
          >
            Administrator Login
          </button>

        </form>

      </div>


      <div class="login-divider">
        <span>OR</span>
      </div>


      <!-- STAFF -->

      <div class="login-section">

        <div class="login-section-title">
          Staff Member
        </div>

        <form id="staffLoginForm">

          <label for="staffCode">
            Staff Access Code
          </label>

          <input
            id="staffCode"
            type="text"
            placeholder="AEGIS-XXXX-XXXX"
            autocomplete="off"
            autocapitalize="characters"
            required
          >

          <button
            type="submit"
            class="secondary-button full-width"
          >
            Staff Login
          </button>

        </form>

      </div>


      <div
        id="loginMessage"
        class="login-message"
      ></div>


      <a
        href="/"
        class="back-link"
      >
        ← Return to website
      </a>

    </div>

  </div>


<script>

const adminForm =
  document.getElementById(
    "adminLoginForm"
  );

const staffForm =
  document.getElementById(
    "staffLoginForm"
  );

const message =
  document.getElementById(
    "loginMessage"
  );


function showMessage(
  text,
  type = "error"
) {

  message.textContent =
    text;

  message.className =
    "login-message " +
    type;

}


/* =========================================================
   ADMIN LOGIN
========================================================= */

adminForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    showMessage(
      "Signing in...",
      "loading"
    );


    const password =
      document
        .getElementById(
          "adminPassword"
        )
        .value;


    try {

      const response =
        await fetch(
          "/api/auth/password",
          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify({

                password

              })

          }
        );


      const data =
        await response.json();


      if (
        !response.ok ||
        !data.success
      ) {

        showMessage(
          data.error ||
          "Unable to sign in."
        );

        return;

      }


      window.location.href =
        data.redirect ||
        "/admin.html";

    } catch {

      showMessage(
        "Unable to connect to the Aegis portal."
      );

    }

  }
);


/* =========================================================
   STAFF LOGIN
========================================================= */

staffForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    showMessage(
      "Checking access code...",
      "loading"
    );


    const code =
      document
        .getElementById(
          "staffCode"
        )
        .value
        .trim()
        .toUpperCase();


    try {

      const response =
        await fetch(
          "/api/auth/code",
          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify({

                code

              })

          }
        );


      const data =
        await response.json();


      if (
        !response.ok ||
        !data.success
      ) {

        showMessage(
          data.error ||
          "Invalid staff code."
        );

        return;

      }


      window.location.href =
        data.redirect ||
        "/staff.html";

    } catch {

      showMessage(
        "Unable to connect to the Aegis portal."
      );

    }

  }
);

</script>

</body>
</html>
