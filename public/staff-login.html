<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Staff Login — The Aegis Institute
  </title>

  <link
    rel="stylesheet"
    href="/portal.css"
  >

</head>


<body class="portal-page login-page">


  <main class="login-shell">


    <a
      class="portal-brand"
      href="/"
    >

      <span class="brand-mark">
        A
      </span>

      <span>
        THE AEGIS INSTITUTE
      </span>

    </a>


    <section class="login-card">


      <div class="login-icon">
        A
      </div>


      <div class="eyebrow">
        STAFF PORTAL
      </div>


      <h1>
        Welcome back.
      </h1>


      <p class="login-intro">

        Enter your staff access code
        to continue to the Aegis
        Institute staff portal.

      </p>


      <form id="loginForm">


        <label for="code">
          Staff access code
        </label>


        <div class="input-wrap">

          <input
            id="code"
            name="code"
            type="password"
            autocomplete="off"
            placeholder="Enter your access code"
            required
          >


          <button
            type="button"
            class="show-btn"
            id="showCode"
          >
            Show
          </button>

        </div>


        <button
          class="primary-btn full-btn"
          type="submit"
          id="loginButton"
        >
          Sign in
        </button>


        <div
          id="loginMessage"
          class="form-message"
          aria-live="polite"
        ></div>


      </form>


      <div class="login-divider">

        <span>
          ADMINISTRATOR
        </span>

      </div>


      <button
        type="button"
        class="secondary-btn full-btn"
        id="adminLoginButton"
      >
        Main Administrator Login
      </button>


      <form
        id="adminForm"
        class="hidden admin-form"
      >


        <label for="adminPassword">
          Administrator password
        </label>


        <input
          id="adminPassword"
          type="password"
          autocomplete="current-password"
          placeholder="Enter administrator password"
        >


        <button
          class="primary-btn full-btn"
          type="submit"
        >
          Continue as Administrator
        </button>


        <div
          id="adminMessage"
          class="form-message"
          aria-live="polite"
        ></div>


      </form>


    </section>


    <p class="login-footer">

      © 2026 The Aegis Institute

    </p>


  </main>


  <script>

    const loginForm =
      document.getElementById(
        "loginForm"
      );


    const codeInput =
      document.getElementById(
        "code"
      );


    const loginButton =
      document.getElementById(
        "loginButton"
      );


    const loginMessage =
      document.getElementById(
        "loginMessage"
      );


    const showCode =
      document.getElementById(
        "showCode"
      );


    const adminLoginButton =
      document.getElementById(
        "adminLoginButton"
      );


    const adminForm =
      document.getElementById(
        "adminForm"
      );


    const adminMessage =
      document.getElementById(
        "adminMessage"
      );


    showCode.addEventListener(
      "click",
      () => {

        const showing =
          codeInput.type ===
            "password";


        codeInput.type =
          showing
            ? "text"
            : "password";


        showCode.textContent =
          showing
            ? "Hide"
            : "Show";

      }
    );


    loginForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        loginMessage.textContent =
          "";


        loginButton.disabled =
          true;


        loginButton.textContent =
          "Signing in…";


        try {

          const response =
            await fetch(
              "/api/auth/code",
              {

                method:
                  "POST",

                headers: {

                  "Content-Type":
                    "application/json"

                },

                body:
                  JSON.stringify({

                    code:
                      codeInput.value

                  })

              }
            );


          const data =
            await response.json();


          if (
            !response.ok
          ) {

            throw new Error(
              data.error ||
              "Unable to sign in."
            );

          }


          window.location.href =
            data.redirect ||
            "/staff.html";


        } catch (
          error
        ) {

          loginMessage.textContent =
            error.message;


          loginMessage.className =
            "form-message error";


          loginButton.disabled =
            false;


          loginButton.textContent =
            "Sign in";

        }

      }
    );


    adminLoginButton.addEventListener(
      "click",
      () => {

        adminForm.classList.toggle(
          "hidden"
        );


        if (
          !adminForm.classList.contains(
            "hidden"
          )
        ) {

          document
            .getElementById(
              "adminPassword"
            )
            .focus();

        }

      }
    );


    adminForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        adminMessage.textContent =
          "";


        const password =
          document
            .getElementById(
              "adminPassword"
            )
            .value;


        try {

          const response =
            await fetch(
              "/api/auth/password",
              {

                method:
                  "POST",

                headers: {

                  "Content-Type":
                    "application/json"

                },

                body:
                  JSON.stringify({

                    password

                  })

              }
            );


          const data =
            await response.json();


          if (
            !response.ok
          ) {

            throw new Error(
              data.error ||
              "Administrator login failed."
            );

          }


          window.location.href =
            data.redirect ||
            "/admin.html";


        } catch (
          error
        ) {

          adminMessage.textContent =
            error.message;


          adminMessage.className =
            "form-message error";

        }

      }
    );

  </script>

</body>

</html>
