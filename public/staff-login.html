<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Staff Login — The Aegis Institute</title>

  <link
    rel="stylesheet"
    href="/styles.css"
  >

  <style>

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: #f7fafb;
    }

    .login-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border: 1px solid #e4ebee;
      border-radius: 22px;
      padding: 42px;
      box-shadow: 0 20px 60px rgba(15, 35, 50, 0.08);
    }

    .login-logo {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: #62d8d2;
      color: #092c3c;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 26px;
    }

    .login-kicker {
      color: #4dbdb8;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .login-card h1 {
      margin: 0 0 12px;
      color: #082c3d;
      font-size: 38px;
      line-height: 1.1;
    }

    .login-card p {
      margin: 0 0 28px;
      color: #647782;
      line-height: 1.7;
      font-size: 16px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .login-form label {
      color: #183d4d;
      font-size: 14px;
      font-weight: 700;
    }

    .login-form input {
      width: 100%;
      box-sizing: border-box;
      padding: 16px 17px;
      border: 1px solid #d7e1e5;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
      color: #163846;
      background: #ffffff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .login-form input:focus {
      border-color: #62d8d2;
      box-shadow: 0 0 0 4px rgba(98, 216, 210, 0.15);
    }

    .login-button {
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      padding: 16px 20px;
      background: #62d8d2;
      color: #082c3d;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .login-button:hover {
      transform: translateY(-1px);
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .login-error {
      display: none;
      padding: 13px 15px;
      border-radius: 10px;
      background: #fff0f0;
      border: 1px solid #ffd4d4;
      color: #a33a3a;
      font-size: 14px;
      line-height: 1.5;
    }

    .login-back {
      display: inline-block;
      margin-top: 24px;
      color: #4a727e;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .login-back:hover {
      color: #082c3d;
    }

  </style>
</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <div class="login-logo">
        A
      </div>

      <div class="login-kicker">
        Staff Portal
      </div>

      <h1>
        Welcome back.
      </h1>

      <p>
        Enter the staff password to access the
        Aegis Institute administration portal.
      </p>

      <form
        class="login-form"
        id="loginForm"
      >

        <label for="password">
          Staff Password
        </label>

        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <div
          class="login-error"
          id="loginError"
        ></div>

        <button
          class="login-button"
          id="loginButton"
          type="submit"
        >
          Sign In
        </button>

      </form>

      <a
        class="login-back"
        href="/"
      >
        ← Back to The Aegis Institute
      </a>

    </section>

  </main>


  <script>

    const form =
      document.getElementById(
        "loginForm"
      );

    const password =
      document.getElementById(
        "password"
      );

    const button =
      document.getElementById(
        "loginButton"
      );

    const errorBox =
      document.getElementById(
        "loginError"
      );


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        errorBox.style.display =
          "none";

        button.disabled =
          true;

        button.textContent =
          "Signing in...";


        try {

          const response =
            await fetch(
              "/api/auth/password",
              {

                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    password:
                      password.value
                  })

              }
            );


          const data =
            await response.json();


          if (
            !response.ok ||
            !data.success
          ) {

            throw new Error(
              data.error ||
              "Unable to sign in."
            );

          }


          window.location.href =
            "/admin.html";


        } catch (error) {

          errorBox.textContent =
            error.message ||
            "Incorrect password.";

          errorBox.style.display =
            "block";

          password.value =
            "";

          password.focus();

          button.disabled =
            false;

          button.textContent =
            "Sign In";

        }

      }
    );

  </script>

</body>
</html>
